<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    #back-button {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999;
      padding: 14px 22px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <button id="back-button">Kembali</button>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">

    <a-marker preset="hiro">
      <a-entity
        id="food-model"
        position="0 0.12 0"
        scale="0.2 0.2 0.2">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const params = new URLSearchParams(window.location.search);
    const menu = params.get("menu") === "pizza" ? "pizza" : "burger";

    document.getElementById("food-model").setAttribute(
      "gltf-model",
      "./" + menu + ".glb"
    );

    document.getElementById("back-button").onclick = function () {
      window.location.href = "./index.html?menu=" + menu;
    };
  </script>

</body>
</html>
