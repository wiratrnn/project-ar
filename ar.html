<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Menu</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>
<body>

  <button
    onclick="history.back()"
    style="position:fixed;top:10px;left:10px;z-index:9999;">
    Kembali
  </button>

  <a-scene embedded arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">

    <a-marker preset="hiro">
      <a-entity
        id="model"
        position="0 0.12 0"
        scale="0.2 0.2 0.2">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const params = new URLSearchParams(location.search);
    const menu = params.get("menu") === "pizza" ? "pizza" : "burger";

    document.getElementById("model").setAttribute(
      "gltf-model",
      `./${menu}.glb`
    );
  </script>

</body>
</html>
