<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bite & Beyond — Menu</title>
  <style>
    :root {
      --bg: #f6f3ed;
      --card: #ffffff;
      --text: #20231f;
      --green: #2e5b43;
      --lime: #d9ed8b;
      --border: #e7e2d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px 16px 100px; max-width: 800px; margin: auto; }
    h1 { margin-bottom: 16px; font-size: 1.5rem; }
    
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card { background: var(--card); border: 4px solid var(--border); border-radius: 16px; padding: 20px 16px; text-align: center; cursor: pointer; transition: transform 0.2s; }
    .card:active { transform: scale(0.9); }
    .card.selected { border-color: var(--green); box-shadow: 0 4px 12px rgba(46, 91, 67, 0.12); }
    
    .badge { font-size: 0.7rem; font-weight: 700; background: var(--lime); padding: 4px 8px; border-radius: 20px; text-transform: uppercase; }
    .emoji { font-size: 4rem; display: block; margin: 12px 0; }
    
    .dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(246, 243, 237, 0.95); border-top: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(8px); }
    .dock-label { font-size: 0.75rem; color: #71766e; display: block; }
    .dock-title { font-size: 1rem; font-weight: 800; }
    
    .btn-ar { background: var(--green); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .btn-ar:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <main>
    <h1>Pilih Menu</h1>
    <div class="grid" id="menu-grid">
      <div class="card selected" onclick="selectMenu(this, 'Sandwich', 'sandwich')">
        <span class="badge">Best Seller</span><span class="emoji">🥪</span><h3>Sandwich</h3>
      </div>
      <div class="card" onclick="selectMenu(this, 'Donat', 'donat')">
        <span class="badge">Pilihan</span><span class="emoji">🍩</span><h3>Donat</h3>
      </div>
      <div class="card" onclick="selectMenu(this, 'Pancake', 'pancake')">
        <span class="badge">Signature</span><span class="emoji">🥞</span><h3>Pancake</h3>
      </div>
      <div class="card" onclick="selectMenu(this, 'Puding', 'puding')">
        <span class="badge">Pilihan</span><span class="emoji">🍮</span><h3>Puding</h3>
      </div>
    </div>
  </main>

  <div class="dock">
    <div>
      <span class="dock-label">MENU DIPILIH</span>
      <span class="dock-title" id="selected-title">Sandwich</span>
    </div>
    <button class="btn-ar" onclick="window.location.href=`./ar.html?menu=${selectedKey}`">Tampilkan AR</button>
  </div>

  <script>
    let selectedKey = 'sandwich';
    function selectMenu(el, name, key) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('selected-title').textContent = name;
      selectedKey = key;
    }
  </script>

</body>
</html>
