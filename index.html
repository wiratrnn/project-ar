<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR - Burger</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;">

    <!-- Memuat model burger -->
    <a-assets>
      <a-asset-item
        id="burger"
        src="./burger.glb">
      </a-asset-item>
    </a-assets>

    <!-- Marker Hiro -->
    <a-marker preset="hiro">

      <!-- Model 3D burger -->
      <a-entity
        gltf-model="#burger"
        position="0 0.1 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-entity>

    </a-marker>
    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
